<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="waldhausLogoTitle waldhausLogoDesc">
  <title id="waldhausLogoTitle">Waldhaus – Natur &amp; Entspannung</title>
  <desc id="waldhausLogoDesc">Die freigegebene Waldhaus-Logoform als helle UI-Variante in Warm White auf Deep Forest.</desc>
  <defs>
    <filter id="waldhausLightUi" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="logoLuminance"/>
      <feComponentTransfer in="logoLuminance" result="logoMask">
        <feFuncA type="linear" slope="8" intercept="-4"/>
      </feComponentTransfer>
      <feFlood flood-color="#F8F5ED" result="warmWhite"/>
      <feComposite in="warmWhite" in2="logoMask" operator="in"/>
    </filter>
  </defs>
  <rect width="192" height="192" rx="36" fill="#13261F"/>
  <image href="icon-192.png" width="192" height="192" preserveAspectRatio="xMidYMid meet" filter="url(#waldhausLightUi)"/>
</svg>
