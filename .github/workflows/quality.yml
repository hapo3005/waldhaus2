name: Demo quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify required demo files
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f home-hero.js
          test -f home-hero.css
          for i in $(seq -w 1 11); do test -f "assets/hero-start-clean.v2/part-${i}.txt"; done
          test -f owner-ops.js
          test -f owner-ops.css
          test -f verified-content.js
          test -f guide-experience.js
          test -f guide-experience.css
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f icon-192.png
          test -f icon-512.png

      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check home-hero.js
          node --check owner-ops.js
          node --check verified-content.js
          node --check guide-experience.js
          node --check service-worker.js

      - name: Validate clean Start hero image payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, struct

          parts = [f'assets/hero-start-clean.v2/part-{i:02d}.txt' for i in range(1, 12)]
          payload = ''.join(Path(path).read_text().strip() for path in parts)
          if len(payload) != 128112:
              raise SystemExit(f'Clean hero base64 incomplete: {len(payload)}/128112')

          data = base64.b64decode(payload, validate=True)
          if len(data) != 96084:
              raise SystemExit(f'Clean hero size mismatch: {len(data)}/96084')
          if data[:4] != b'RIFF' or data[8:12] != b'WEBP':
              raise SystemExit('Clean hero is not a WebP RIFF file')
          expected = struct.unpack('<I', data[4:8])[0] + 8
          if expected != len(data):
              raise SystemExit(f'Clean hero RIFF incomplete: {len(data)}/{expected}')

          digest = hashlib.sha256(data).hexdigest()
          expected_sha = '121d21258a7ebbd4f664ff29e631f8c02c9c09a04585b625f3d53c4818726c84'
          if digest != expected_sha:
              raise SystemExit(f'Clean hero hash mismatch: {digest}')
          print(f'Clean Start hero valid: {len(data)} bytes, sha256={digest}')
          PY

      - name: Guard clean hero runtime
        run: |
          grep -q 'hero-start-clean.v2' home-hero.js
          ! grep -q 'hero-start-day.parts' home-hero.js
          ! grep -q 'backdrop-filter:blur(6px)' home-hero.css

      - name: Validate web manifest JSON
        run: python -m json.tool manifest.webmanifest > /dev/null

      - name: Guard against accidental high-risk secrets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          patterns = {
              "OpenAI-style key": re.compile(r"sk-[A-Za-z0-9_-]{20,}"),
              "Google API key": re.compile(r"AIza[0-9A-Za-z_-]{30,}"),
              "private key": re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
          }
          allowed_suffixes = {".png", ".jpg", ".jpeg", ".webp", ".gif"}
          findings = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path.suffix.lower() in allowed_suffixes:
                  continue
              try:
                  text = path.read_text(errors='ignore')
              except OSError:
                  continue
              for label, pattern in patterns.items():
                  if pattern.search(text):
                      findings.append(f"{label}: {path}")
          if findings:
              raise SystemExit("Potential secrets found:\n" + "\n".join(findings))
          PY
